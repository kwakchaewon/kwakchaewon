<svg xmlns="http://www.w3.org/2000/svg" width="400" height="558" viewBox="0 0 400 558" role="img" aria-label="경력: 이든티앤에스 기술연구소 대리 · 백엔드 / 기술지원 (2024.02 ~ 재직 중) - 표준 Oracle 환경 대응을 위한 MyBatis → JPA/QueryDSL 리팩토링, RPM · Inno Setup 기반 설치 패키지 표준화, 솔루션 보안 취약점 개선 및 고객사 납품 대응, 업무 프로세스 AX 전환 / 태화이노베이션 SI사업부 사원 (2019.09 ~ 2020.07) - 국민은행 해지 서류 분류 시스템 유지보수">
  <style>
    .company { font: 700 18px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif; fill: #D97757; letter-spacing: -0.3px; }
    .role, .period { font: 500 13px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif; fill: #57606A; }
    .title { font: 700 15px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif; fill: #1F2328; }
    .sub { font: 500 14px 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif; fill: #1F2328; }
    .em { font-weight: 700; fill: #D97757; }
    .dot { fill: #D97757; }
    .div { stroke: #8B949E; stroke-opacity: 0.3; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .title, .sub { fill: #E6EDF3; }
      .role, .period { fill: #9198A1; }
    }
  </style>

  <text class="company" x="16" y="28">이든티앤에스</text>
  <text class="period" x="384" y="28" text-anchor="end">2024.02 ~ 재직 중</text>
  <text class="role" x="16" y="49">기술연구소 대리 · 백엔드 / 기술지원</text>
  <circle class="dot" cx="20" cy="80" r="3"/>
  <text class="title" x="32" y="85">표준 Oracle 환경 대응을 위한 MyBatis →</text>
  <text class="title" x="32" y="106">JPA/QueryDSL 리팩토링</text>
  <text class="sub" x="32" y="127">Oracle 기준 DDL 재설계 · QueryDSL 전환으로</text>
  <text class="sub" x="32" y="148"><tspan class="em">은행권</tspan> <tspan class="em">수주</tspan></text>
  <circle class="dot" cx="20" cy="173" r="3"/>
  <text class="title" x="32" y="178">RPM · Inno Setup 기반 설치 패키지 표준화</text>
  <text class="sub" x="32" y="199">Linux 8개 OS RPM · Windows 단일 .exe로 통일 (<tspan class="em">34개</tspan></text>
  <text class="sub" x="32" y="220"><tspan class="em">항목</tspan> <tspan class="em">자동</tspan> <tspan class="em">검증,</tspan> <tspan class="em">배포</tspan> <tspan class="em">용량</tspan> <tspan class="em">53%↓</tspan>)</text>
  <circle class="dot" cx="20" cy="245" r="3"/>
  <text class="title" x="32" y="250">솔루션 보안 취약점 개선 및 고객사 납품 대응</text>
  <text class="sub" x="32" y="271">고객사마다 다른 보안 요구로 매번 개별 대응 →</text>
