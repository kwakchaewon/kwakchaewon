  <text class="sub" x="32" y="313">분석·평가 방법(2021)」을 공통 기준으로 <tspan class="em">조치·증빙</tspan></text>
  <text class="sub" x="32" y="334"><tspan class="em">절차</tspan> <tspan class="em">표준화</tspan></text>
  <circle class="dot" cx="20" cy="359" r="3"/>
  <text class="title" x="32" y="364">업무 프로세스 AX 전환</text>
  <text class="sub" x="32" y="385"><tspan class="em">Claude</tspan> <tspan class="em">스킬</tspan> <tspan class="em">30개</tspan>로 개발 사이클 정형화 · Notion</text>
  <text class="sub" x="32" y="406">MCP 표준 문서 파이프라인 · openKB 사내 아카이브</text>
  <text class="sub" x="32" y="427">챗봇</text>
  <line class="div" x1="16" y1="445" x2="384" y2="445"/>
